name: ai

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ./data/ollama:/root/.ollama

    devices:
      - nvidia.com/gpu=all

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped

    depends_on:
      ollama:
        condition: service_healthy

    ports:
      - "3000:8080"

    environment:
      OLLAMA_BASE_URL: http://ollama:11434

    volumes:
      - ./data/open-webui:/app/backend/data

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    command: gateway run
    restart: unless-stopped

    depends_on:
      ollama:
        condition: service_healthy

    stdin_open: true
    tty: true

    ports:
      - "8642:8642"

    volumes:
      - ./data/hermes:/opt/data
      # Long syntax so a MISSING .env errors loudly at `up` instead of
      # Docker silently creating a .env DIRECTORY (the file/folder bug).
      - type: bind
        source: ./.env
        target: /opt/data/.env
        read_only: true
        bind:
          create_host_path: false

    environment:
      TZ: Europe/London

      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "5f4d1d3b9b0d8c9c8f0f7a7f4c0b8e3a1d9e7f6c5b4a39281726354455667788"

      OLLAMA_BASE_URL: http://ollama:11434
      OPENAI_API_BASE_URL: http://hermes:8642/v1
      OPENAI_API_KEY: 5f4d1d3b9b0d8c9c8f0f7a7f4c0b8e3a1d9e7f6c5b4a39281726354455667788
